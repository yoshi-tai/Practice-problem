<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>母性 12</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="12"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  臍帯脱出について誤っているのはどれか。
</div>

<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="1" value="opt1"/>骨盤位で起きやすい</li>
  <li><input type="checkbox" name="checkbox" id="2" value="opt2"/>骨盤高位にする</li>
  <li><input type="checkbox" name="checkbox" id="3" value="opt3"/>破水前に起きる</li>
  <li><input type="checkbox" name="checkbox" id="4" value="opt4"/>胎児の予後は悪い</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>3</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div>臍帯脱出は破水後に起こることが多く、破水前に起きるという記述は誤りである。</div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
      <ul>
        <li><strong>1</strong>: 骨盤位では臍帯脱出が起こりやすい。</li>
        <li><strong>2</strong>: 臍帯脱出時には臍帯への圧迫を軽減するため、骨盤高位などの体位をとる。</li>
        <li><strong>4</strong>: 臍帯が圧迫されることで胎児への酸素供給が低下し、胎児予後に影響する。</li>
      </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
<script src="../page_move/page_move.js"></script>
</body>
</html>
