<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>母性 13</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="13"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  正期産の低出生体重児に起こりやすいのはどれか。
</div>

<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="1" value="opt1"/>高血糖</li>
  <li><input type="checkbox" name="checkbox" id="2" value="opt2"/>吐血・低血糖</li>
  <li><input type="checkbox" name="checkbox" id="3" value="opt3"/>新生児メレナ</li>
  <li><input type="checkbox" name="checkbox" id="4" value="opt4"/>高ビリルビン血症</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>4</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div>正期産の低出生体重児では肝機能の未熟性などから高ビリルビン血症を起こしやすい。</div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
      <ul>
        <li><strong>1</strong>: 正期産の低出生体重児では、高血糖より低血糖に注意する。</li>
        <li><strong>2</strong>: 低出生体重児では低血糖を起こしやすいが、吐血が特徴的とはいえない。</li>
        <li><strong>3</strong>: 新生児メレナは特定の状況でみられるが、低出生体重児に特徴的な所見ではない。</li>
      </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
<script src="../page_move/page_move.js"></script>
</body>
</html>
