<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>母性 2</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="2"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  2024年113回看護師国家試験 自然流産を連続（）回以上繰り返した状態を習慣流産という。
</div>

<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="1" value="opt1"/>2</li>
  <li><input type="checkbox" name="checkbox" id="2" value="opt2"/>3</li>
  <li><input type="checkbox" name="checkbox" id="3" value="opt3"/>4</li>
  <li><input type="checkbox" name="checkbox" id="4" value="opt4"/>5</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>2</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div>自然流産を連続3回以上繰り返した状態を習慣流産という。</div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
      <ul>
        <li><strong>1</strong>: 2回の自然流産では習慣流産とはしない。</li>
        <li><strong>3</strong>: 4回以上ではなく、3回以上が基準である。</li>
        <li><strong>4</strong>: 5回以上ではなく、3回以上が基準である。</li>
      </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
<script src="../page_move/page_move.js"></script>
</body>
</html>
