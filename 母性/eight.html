<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>母性 8</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="8"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  在胎33週4日で出生した低出生体重児、正期産の成熟児との比較で誤っているのはどれか。
</div>

<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="1" value="opt1"/>吐乳しやすい</li>
  <li><input type="checkbox" name="checkbox" id="2" value="opt2"/>皮下脂肪が少ない</li>
  <li><input type="checkbox" name="checkbox" id="3" value="opt3"/>多呼吸を起こしやすい</li>
  <li><input type="checkbox" name="checkbox" id="4" value="opt4"/>体重当たりの体表面積が小さい</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>4</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div>早産児は体重当たりの体表面積が**大きい**ため、誤りである。</div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
      <ul>
        <li><strong>1</strong>: 早産児は哺乳機能が未熟で、吐乳しやすい。</li>
        <li><strong>2</strong>: 早産児は皮下脂肪が少ない。</li>
        <li><strong>3</strong>: 呼吸機能が未熟で、多呼吸などの呼吸障害を起こしやすい。</li>
      </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
<script src="../page_move/page_move.js"></script>
</body>
</html>
