<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>母性 9</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="9"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  多胎妊娠で起こりやすい妊娠中の異常はどれか。
</div>

<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="1" value="opt1"/>早産</li>
  <li><input type="checkbox" name="checkbox" id="2" value="opt2"/>妊娠悪阻</li>
  <li><input type="checkbox" name="checkbox" id="3" value="opt3"/>妊娠糖尿病</li>
  <li><input type="checkbox" name="checkbox" id="4" value="opt4"/>ビタミンB12欠乏性貧血</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>1</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div>多胎妊娠では子宮の過度な伸展などにより、早産のリスクが高くなる。</div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
      <ul>
        <li><strong>2</strong>: 妊娠悪阻は多胎妊娠で増加することがあるが、代表的な合併症ではない。</li>
        <li><strong>3</strong>: 妊娠糖尿病のリスクは上昇するが、選択肢の中では早産が代表的である。</li>
        <li><strong>4</strong>: 多胎妊娠では鉄欠乏性貧血などが起こりやすいが、ビタミンB12欠乏性貧血が特徴的ではない。</li>
      </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
<script src="../page_move/page_move.js"></script>
</body>
</html>
