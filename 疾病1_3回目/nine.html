<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="9"></span>

</div>

<div class="box">
  更年期女性のホルモン補充療法によってリスクが低くなるのはどれか。
</div>

<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="opt1" value="opt1"/>乳癌</li>
        <li><input type="checkbox" name="checkbox" id="opt2" value="opt2"/>骨粗鬆症</li>
        <li><input type="checkbox" name="checkbox" id="opt3" value="opt3"/>子宮体癌</li>
        <li><input type="checkbox" name="checkbox" id="opt4" value="opt4"/>静脈血栓症</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>2</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div>ホルモン補充療法により低下したエストロゲンが補充されるため、骨の吸収を抑制し骨粗鬆症のリスクが低下する。</div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
    <div>
      <ul>
        <li><strong>1</strong>: 乳癌 → ホルモン補充療法により乳癌リスクが上昇する可能性がある。</li>
        <li><strong>3</strong>: 子宮体癌 → エストロゲン補充により子宮体癌リスクが上昇する可能性がある。</li>
        <li><strong>4</strong>: 静脈血栓症 → ホルモン補充療法により静脈血栓症リスクが上昇する可能性がある。</li>
      </ul>
    </div>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>
