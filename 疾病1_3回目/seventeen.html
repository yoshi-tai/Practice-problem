<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>疾病1_3回目 17</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="17"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  乳癌の検査で侵襲性が高いのはどれか。
</div>

<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="opt1" value="opt1"/>触診</li>
        <li><input type="checkbox" name="checkbox" id="opt2" value="opt2"/>細胞診</li>
        <li><input type="checkbox" name="checkbox" id="opt3" value="opt3"/>MRI検査</li>
        <li><input type="checkbox" name="checkbox" id="opt4" value="opt4"/>超音波検査</li>
        <li><input type="checkbox" name="checkbox" id="opt5" value="opt5"/>マンモグラフィ</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>2</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div>細胞診は乳房組織から細胞を採取する検査であり、生検に比べて侵襲性は低いが、触診、画像検査より侵襲性が高い検査である。</div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
    <div>
      <ul>
        <li><strong>1</strong>: 触診 → 非侵襲的な検査である。</li>
        <li><strong>3</strong>: MRI検査 → 非侵襲的な画像検査である。</li>
        <li><strong>4</strong>: 超音波検査 → 非侵襲的な画像検査である。</li>
        <li><strong>5</strong>: マンモグラフィ → 非侵襲的な画像検査である。</li>
      </ul>
    </div>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
<script src="../page_move/page_move.js"></script>
