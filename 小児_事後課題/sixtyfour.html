<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小児_事後課題 64</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="64"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  水痘の発疹の変化として、2番目に起こるのはどれか。
</div>


<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="opt1" value="opt1"/>痂皮</li>
  <li><input type="checkbox" name="checkbox" id="opt2" value="opt2"/>丘疹</li>
  <li><input type="checkbox" name="checkbox" id="opt3" value="opt3"/>紅斑</li>
  <li><input type="checkbox" name="checkbox" id="opt4" value="opt4"/>水疱</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>2</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div><div>痂皮は後期にみられる。</div><div>水痘の発疹は紅斑、丘疹、水疱、痂皮へ変化する。</div><div>紅斑は最初にみられる。</div><div>水疱は丘疹の次にみられる。</div></div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
    <ul>
        <li><strong>1</strong>：痂皮は後期にみられる。</li>
        <li><strong>2</strong>：水痘の発疹は紅斑、丘疹、水疱、痂皮へ変化する。</li>
        <li><strong>3</strong>：紅斑は最初にみられる。</li>
        <li><strong>4</strong>：水疱は丘疹の次にみられる。</li>
    </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
