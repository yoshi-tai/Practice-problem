<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小児_事後課題 41</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="41"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  クループ症候群の症状でないものはどれか。
</div>


<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="opt1" value="opt1"/>嗄声</li>
  <li><input type="checkbox" name="checkbox" id="opt2" value="opt2"/>犬吠様咳嗽</li>
  <li><input type="checkbox" name="checkbox" id="opt3" value="opt3"/>発疹</li>
  <li><input type="checkbox" name="checkbox" id="opt4" value="opt4"/>喘鳴</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>3</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div><div>嗄声はクループでみられる。</div><div>犬吠様咳嗽は特徴的症状である。</div><div>発疹はクループ症候群の典型症状ではない。</div><div>吸気性喘鳴がみられる。</div></div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
    <ul>
        <li><strong>1</strong>：嗄声はクループでみられる。</li>
        <li><strong>2</strong>：犬吠様咳嗽は特徴的症状である。</li>
        <li><strong>3</strong>：発疹はクループ症候群の典型症状ではない。</li>
        <li><strong>4</strong>：吸気性喘鳴がみられる。</li>
    </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>
