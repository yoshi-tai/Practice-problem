<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小児_事後課題 68</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../page_move/page_move.css">
</head>
<body>
<div class="LineUp">
  問題 <span id="problemNumber" value="68"></span>
  <input type="button" value="答え" onclick="showAnswer()">
</div>

<div class="box">
  入院3日、頭痛・悪心、血圧148/88mmHg。起こりうる症状はどれか。
</div>


<div id="correctMark">正解！</div>

<ol>
  <li><input type="checkbox" name="checkbox" id="opt1" value="opt1"/>眼のかゆみ</li>
  <li><input type="checkbox" name="checkbox" id="opt2" value="opt2"/>意識障害</li>
  <li><input type="checkbox" name="checkbox" id="opt3" value="opt3"/>耳漏</li>
  <li><input type="checkbox" name="checkbox" id="opt4" value="opt4"/>鼻閉</li>
</ol>

<div class="button">
  <input type="button" id="back" value="戻る" onclick="goBack(this)">
  <input type="button" id="answerBtn" value="OK" onclick="oK()">
  <input type="button" id="next" value="次へ" onclick="goNext(this)">
</div>

<br/>
<div id="modal1" style="display: none;">
  <details>
    <summary>【答え】</summary>
    <div>2</div>
  </details><br/>

  <details>
    <summary>【答えの解説】</summary>
    <div><div>眼のかゆみは高血圧性の合併症として典型ではない。</div><div>急性糸球体腎炎で高血圧が進むと高血圧性脳症による意識障害に注意する。</div><div>耳漏は関連が低い。</div><div>鼻閉は関連が低い。</div></div>
  </details><br/>

  <details>
    <summary>【選択肢の解説】</summary>
    <ul>
        <li><strong>1</strong>：眼のかゆみは高血圧性の合併症として典型ではない。</li>
        <li><strong>2</strong>：急性糸球体腎炎で高血圧が進むと高血圧性脳症による意識障害に注意する。</li>
        <li><strong>3</strong>：耳漏は関連が低い。</li>
        <li><strong>4</strong>：鼻閉は関連が低い。</li>
    </ul>
  </details>

  <br />
  <input type="button" class="close" value="とじる" onclick="closeModal()">
</div>

<div id="pageMove"></div>

<script src="shippei1.js"></script>
<script src="answer.js"></script>
<script src="../page_move/page_move.js"></script>
</body>
</html>
